<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стройконтроль – Суворовские бастионы</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f4f9; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 25px 30px 35px; }
        h1 { font-size: 26px; font-weight: 600; color: #1a2634; }
        .sub { color: #5e6f7e; margin-bottom: 25px; font-weight: 500; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 2px solid #eef2f6; padding-bottom: 18px; margin-bottom: 25px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info .name { font-weight: 600; color: #1a7f4a; }
        .user-info .btn-logout { background: #eef2f6; border: none; padding: 5px 15px; border-radius: 30px; cursor: pointer; font-weight: 500; color: #2e3e4e; }
        .user-info .btn-logout:hover { background: #dce3eb; }

        .tabs { display: flex; gap: 8px; border-bottom: 2px solid #e6ecf2; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 22px; background: transparent; border: none; font-size: 15px; font-weight: 600; color: #5e6f7e; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab-btn.active { color: #1a7f4a; border-bottom-color: #1a7f4a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        .input-table th { background: #f7f9fc; padding: 10px 8px; text-align: left; border-bottom: 2px solid #dce3eb; font-weight: 600; color: #2e3e4e; }
        .input-table td { padding: 6px 8px; border-bottom: 1px solid #e6ecf2; vertical-align: middle; }
        .input-table input, .input-table select { width: 100%; padding: 6px 8px; border: 1px solid #dce3eb; border-radius: 6px; font-size: 13px; background: #fafcfe; }
        .input-table input:focus, .input-table select:focus { border-color: #1a7f4a; outline: none; box-shadow: 0 0 0 2px rgba(26,127,74,0.15); }
        .input-table .del-btn { background: none; border: none; color: #b33636; font-size: 18px; cursor: pointer; }
        .input-table .view-btn { background: none; border: none; color: #2b6f9b; font-size: 18px; cursor: pointer; }

        .btn-group { margin: 18px 0 10px; display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { padding: 8px 22px; border: none; border-radius: 30px; font-weight: 600; font-size: 14px; background: #eef2f6; color: #1a2634; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #1a7f4a; color: #fff; }
        .btn-primary:hover { background: #146a3d; }
        .btn-success { background: #2b6f9b; color: #fff; }
        .btn-success:hover { background: #1f5a7d; }
        .btn-outline { background: transparent; border: 2px solid #1a7f4a; color: #1a7f4a; }
        .btn-outline:hover { background: #1a7f4a; color: #fff; }
        .btn-danger { background: #c9453b; color: #fff; }
        .btn-danger:hover { background: #b33636; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .report-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin: 20px 0 30px; }
        .stat-card { background: #f9fbfd; border-radius: 16px; padding: 18px 20px; box-shadow: inset 0 0 0 1px #e6ecf2; }
        .stat-card .label { font-size: 13px; text-transform: uppercase; color: #6a7b8c; font-weight: 600; }
        .stat-card .value { font-size: 30px; font-weight: 700; color: #0b1a2a; margin-top: 4px; }

        .chart-row { display: flex; flex-wrap: wrap; gap: 30px; margin: 30px 0 20px; }
        .chart-box { flex: 1 1 300px; min-width: 250px; background: #fafcfe; border-radius: 16px; padding: 16px; box-shadow: inset 0 0 0 1px #e6ecf2; }
        .chart-box h3 { font-size: 16px; font-weight: 500; margin-bottom: 10px; color: #2e3e4e; }
        .chart-box canvas { width: 100% !important; height: auto !important; max-height: 220px; }

        .report-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 20px 0; }
        .report-table th { background: #f7f9fc; padding: 12px 10px; text-align: left; border-bottom: 2px solid #dce3eb; font-weight: 600; color: #2e3e4e; }
        .report-table td { padding: 12px 10px; border-bottom: 1px solid #e6ecf2; vertical-align: middle; }

        .progress-bar { background: #e6ecf2; height: 10px; border-radius: 10px; overflow: hidden; min-width: 120px; }
        .progress-bar .fill { height: 100%; border-radius: 10px; transition: width 0.4s; }
        .fill.plan { background: #3b6f9b; opacity: 0.35; }
        .fill.fact { background: #1a7f4a; }
        .status-tag { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 30px; background: #eef2f6; color: #2e3e4e; display: inline-block; }
        .status-tag.ok { background: #ddf0e3; color: #0f6e3f; }
        .status-tag.warn { background: #fff3d6; color: #a86b1a; }
        .status-tag.fail { background: #fce4e4; color: #b33636; }

        .gantt-container { margin: 20px 0; overflow-x: auto; }
        .gantt-legend { display: flex; gap: 20px; margin-bottom: 15px; font-size: 14px; }
        .gantt-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .gantt-legend .color-box { width: 20px; height: 12px; border-radius: 4px; display: inline-block; }
        .gantt-grid { position: relative; min-width: 700px; }
        .gantt-row { display: flex; align-items: center; border-bottom: 1px solid #eef2f6; min-height: 44px; }
        .gantt-row .label { width: 180px; min-width: 180px; padding-right: 15px; font-weight: 500; font-size: 13px; color: #1a2634; }
        .gantt-row .timeline { flex: 1; position: relative; height: 32px; background: #f9fbfd; border-radius: 6px; margin: 4px 0; }
        .gantt-bar { position: absolute; top: 4px; height: 24px; border-radius: 6px; opacity: 0.85; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; cursor: default; }
        .gantt-bar.plan { background: #3b6f9b; opacity: 0.5; top: 0; height: 14px; }
        .gantt-bar.fact { background: #1a7f4a; top: 14px; height: 14px; }
        .gantt-bar.fact.behind { background: #c9453b; }
        .gantt-bar.fact.ahead { background: #1a7f4a; }
        .gantt-month-labels { display: flex; margin-left: 180px; padding: 6px 0; font-size: 12px; color: #5e6f7e; }
        .gantt-month-labels div { flex: 1; text-align: center; border-right: 1px solid #e6ecf2; }
        .gantt-month-labels div:last-child { border-right: none; }

        .export-group { display: flex; gap: 14px; justify-content: flex-end; margin-top: 25px; padding-top: 20px; border-top: 1px solid #e6ecf2; }

        /* Сменный учёт */
        .shift-status {
            background: #f9fbfd;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .shift-status .status-text { font-weight: 600; font-size: 16px; }
        .shift-status .status-text .open { color: #1a7f4a; }
        .shift-status .status-text .closed { color: #5e6f7e; }
        .shift-status .status-text .none { color: #c9453b; }

        .shift-action-form {
            background: #f9fbfd;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: none;
            flex-wrap: wrap;
            gap: 12px;
            align-items: end;
        }
        .shift-action-form .field { display: flex; flex-direction: column; gap: 4px; }
        .shift-action-form .field label { font-size: 13px; font-weight: 500; color: #2e3e4e; }
        .shift-action-form .field input, .shift-action-form .field select { padding: 6px 10px; border: 1px solid #dce3eb; border-radius: 6px; font-size: 13px; background: #fff; width: 160px; }
        .shift-action-form .field input[type="number"] { width: 100px; }
        .shift-action-form .field input[type="file"] { padding: 6px 0; border: none; }
        .shift-action-form .field input[type="text"] { width: 180px; }

        .shift-stats { display: flex; flex-wrap: wrap; gap: 20px; background: #f9fbfd; padding: 16px; border-radius: 16px; margin: 8px 0; }

        .file-list { font-size: 12px; color: #2e3e4e; max-width: 150px; word-break: break-all; }

        /* Модальное окно входа */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-box h2 { margin-bottom: 10px; color: #1a2634; }
        .modal-box p { color: #5e6f7e; margin-bottom: 20px; }
        .modal-box input { width: 100%; padding: 12px 15px; border: 1px solid #dce3eb; border-radius: 10px; font-size: 16px; margin-bottom: 15px; }
