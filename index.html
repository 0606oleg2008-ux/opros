<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Опросник</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/vfs_fonts.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: #1a1410;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        /* Фон с бетонной текстурой */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(
                    45deg,
                    rgba(60, 50, 40, 0.1) 0px,
                    rgba(60, 50, 40, 0.1) 2px,
                    transparent 2px,
                    transparent 6px
                ),
                radial-gradient(ellipse at 30% 40%, #3d2e24 0%, #1a1410 70%);
            z-index: 0;
        }

        /* Строительная лента (декор) */
        .construction-stripe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                #fbbf24 0px,
                #fbbf24 30px,
                #1a1410 30px,
                #1a1410 60px
            );
            z-index: 20;
            box-shadow: 0 2px 12px rgba(251, 191, 36, 0.3);
        }
        .construction-stripe.bottom {
            top: auto;
            bottom: 0;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                #f97316 0px,
                #f97316 20px,
                #1a1410 20px,
                #1a1410 40px
            );
        }

        /* Декоративные элементы – линии и углы */
        .corner-bracket {
            position: fixed;
            border: 3px solid rgba(251, 191, 36, 0.15);
            width: 60px;
            height: 60px;
            z-index: 1;
            pointer-events: none;
        }
        .corner-bracket.tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }
        .corner-bracket.br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        /* Карточка */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 760px;
            background: rgba(26, 20, 16, 0.88);
            backdrop-filter: blur(8px) saturate(1.1);
            -webkit-backdrop-filter: blur(8px) saturate(1.1);
            border-radius: 32px;
            padding: 40px 38px 38px;
            border: 1px solid rgba(251, 191, 36, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(251, 191, 36, 0.1);
            transform: translateY(30px) scale(0.97);
            opacity: 0;
            animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: 20px auto;
        }
        @keyframes cardEntrance {
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .header-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 6px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.2);
        }
        h1 i {
            color: #f97316;
            font-size: 36px;
            filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.4));
            animation: iconPulse 3s infinite ease-in-out;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(-3deg); }
        }

        .badge {
            background: linear-gradient(135deg, #fbbf24, #f97316);
            color: #1a1410;
            padding: 7px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
        }

        .subhead {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 30px;
            padding: 10px 16px;
            border-left: 4px solid #fbbf24;
            background: rgba(251, 191, 36, 0.05);
            border-radius: 0 12px 12px 0;
            line-height: 1.6;
        }
        .subhead i {
            color: #fbbf24;
            margin-right: 8px;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 22px;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.25s;
        }
        .lang-btn:hover {
            border-color: #fbbf24;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #fbbf24, #f97316);
            border-color: transparent;
            color: #1a1410;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.3);
        }

        .form-group {
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 18px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.35s ease;
            animation: fadeSlide 0.6s ease forwards;
            opacity: 0;
            transform: translateY(8px);
        }
        .form-group:nth-child(1) { animation-delay: 0.05s; }
        .form-group:nth-child(2) { animation-delay: 0.10s; }
        .form-group:nth-child(3) { animation-delay: 0.15s; }
        .form-group:nth-child(4) { animation-delay: 0.20s; }
        .form-group:nth-child(5) { animation-delay: 0.25s; }
        .form-group:nth-child(6) { animation-delay: 0.30s; }
        .form-group:nth-child(7) { animation-delay: 0.35s; }
        @keyframes fadeSlide {
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group:hover {
            border-color: rgba(251, 191, 36, 0.25);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }
        .form-group label i {
            color: #fbbf24;
            font-size: 16px;
            width: 22px;
            text-align: center;
            filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.2));
        }
        .form-group label .required {
            color: #f87171;
            margin-left: 2px;
        }
        .sticker-emoji {
            display: inline-block;
            font-size: 26px;
            transition: transform 0.3s ease, filter 0.3s;
            margin-left: auto;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.05));
        }
        .form-group:hover .sticker-emoji {
            animation: stickerPop 0.5s ease forwards;
        }
        @keyframes stickerPop {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.5) rotate(-12deg); }
            60% { transform: scale(0.9) rotate(6deg); }
            100% { transform: scale(1.2) rotate(0deg); }
        }
        .form-group:focus-within .sticker-emoji {
            animation: stickerFocus 0.6s ease forwards;
        }
        @keyframes stickerFocus {
            0% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.6) rotate(-18deg) translateX(4px); }
            100% { transform: scale(1.2) rotate(0); }
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
        }
        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #fbbf24;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1), inset 0 2px 6px rgba(0, 0, 0, 0.4);
            transform: scale(1.01);
        }
        input:hover, select:hover, textarea:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        select option {
            background: #1a1410;
            color: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .inline-group {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 6px 12px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .inline-group label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: color 0.2s;
            margin: 0;
        }
        .inline-group label:hover {
            color: #fbbf24;
        }
        .inline-group input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #fbbf24;
            margin: 0;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.2));
        }
        .inline-group input[type="radio"]:hover {
            transform: scale(1.15);
        }

        .btn {
            background: linear-gradient(135deg, #fbbf24, #f97316);
            color: #1a1410;
            border: none;
            padding: 18px 28px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.3);
            margin-top: 12px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 60%);
            pointer-events: none;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.4), transparent 60%);
            opacity: 0;
            transition: opacity 0.6s;
            pointer-events: none;
        }
        .btn:hover::after {
            opacity: 1;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 40px rgba(251, 191, 36, 0.5);
            background: linear-gradient(135deg, #f59e0b, #ea580c);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn i {
            transition: transform 0.3s;
        }
        .btn:hover i {
            transform: rotate(-6deg) scale(1.1);
        }

        #status {
            margin-top: 24px;
            padding: 16px 20px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 24px;
            display: none;
            text-align: center;
            font-weight: 500;
            color: #fbbf24;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            backdrop-filter: blur(8px);
            animation: fadeSlide 0.4s ease;
        }
        #status i {
            font-size: 24px;
            color: #fbbf24;
        }

        @media (max-width: 600px) {
            .card { padding: 24px 18px; margin: 10px 0; }
            h1 { font-size: 24px; }
            .badge { font-size: 11px; padding: 4px 14px; }
            .form-group { padding: 14px 14px 16px; }
            .inline-group { gap: 14px; padding: 6px 10px; }
            .btn { font-size: 15px; padding: 14px 20px; }
            .lang-btn { font-size: 12px; padding: 4px 12px; }
        }
    </style>
</head>
<body>

<!-- Строительные ленты -->
<div class="construction-stripe"></div>
<div class="construction-stripe bottom"></div>

<!-- Уголки -->
<div class="corner-bracket tl"></div>
<div class="corner-bracket br"></div>

<div class="card">
    <div class="header-wrapper">
        <h1><i class="fas fa-hard-hat"></i> <span id="h1-text">Опросник</span></h1>
        <span class="badge"><i class="fas fa-file-pdf" style="margin-right: 6px;"></i> PDF</span>
    </div>
    <div class="subhead" id="subhead-text">
        <i class="fas fa-pencil-alt"></i>
        <span>Заполните все поля, чтобы сформировать отчёт в PDF</span>
    </div>

    <div class="lang-switcher">
        <button class="lang-btn" data-lang="ru" onclick="setLanguage('ru')">РУ</button>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="tt" onclick="setLanguage('tt')">TT</button>
    </div>

    <form id="surveyForm">
        <div class="form-group">
            <label for="name">
                <i class="fas fa-user"></i>
                <span id="label-name">Ваше имя</span>
                <span class="required">*</span>
                <span class="sticker-emoji">👷</span>
            </label>
            <input type="text" id="name" placeholder="Иванов Иван" required />
        </div>

        <div class="form-group">
            <label for="smu">
                <i class="fas fa-building"></i>
                <span id="label-smu">Какое ваше СМУ?</span>
                <span class="required">*</span>
                <span class="sticker-emoji">🏗️</span>
            </label>
            <input type="text" id="smu" placeholder="Например: СМУ-7" required />
        </div>

        <div class="form-group">
            <label for="shift">
                <i class="fas fa-clock"></i>
                <span id="label-shift">Какая смена?</span>
                <span class="required">*</span>
                <span class="sticker-emoji">🕒</span>
            </label>
            <select id="shift" required>
                <option value="Первая" id="shift-1">Первая</option>
                <option value="Вторая" id="shift-2">Вторая</option>
                <option value="Третья" id="shift-3">Третья</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">
                <i class="fas fa-phone-alt"></i>
                <span id="label-phone">Номер телефона</span>
                <span class="required">*</span>
                <span class="sticker-emoji">📞</span>
            </label>
            <input type="tel" id="phone" placeholder="+7 999 123-45-67" required />
        </div>

        <div class="form-group">
            <label for="materials">
                <i class="fas fa-cubes"></i>
                <span id="label-materials">Сколько было затрачено материала и какого?</span>
                <span class="required">*</span>
                <span class="sticker-emoji">🧱</span>
            </label>
            <textarea id="materials" rows="3" placeholder="Например: 5 кг цемента, 2 рулона обоев..." required></textarea>
        </div>

        <div class="form-group">
            <label>
                <i class="fas fa-tractor"></i>
                <span id="label-tech-used">Использовалась ли техника?</span>
                <span class="required">*</span>
                <span class="sticker-emoji">🚜</span>
            </label>
            <div class="inline-group">
                <label><input type="radio" name="tech" value="Да" onclick="toggleTech(true)" /> <span id="radio-yes">Да</span></label>
                <label><input type="radio" name="tech" value="Нет" onclick="toggleTech(false)" checked /> <span id="radio-no">Нет</span></label>
            </div>
        </div>

        <div class="form-group" id="techDetailsGroup" style="display: none; opacity: 0;">
            <label for="techDetails">
                <i class="fas fa-cog"></i>
                <span id="label-tech-details">Если да, то какая техника использовалась?</span>
                <span class="sticker-emoji">🔧</span>
            </label>
            <textarea id="techDetails" rows="2" placeholder="Например: экскаватор, подъёмник..."></textarea>
        </div>

        <button type="button" class="btn" onclick="generatePDFWithTranslation()">
            <i class="fas fa-file-pdf"></i> <span id="btn-pdf">Скачать PDF</span>
        </button>
    </form>

    <div id="status">
        <i class="fas fa-check-circle"></i>
        <span id="status-text">PDF успешно создан и скачан! Проверьте папку «Загрузки».</span>
    </div>
</div>

<script>
    // ========== ПЕРЕВОДЫ ==========
    const translations = {
        ru: {
            h1: 'Опросник',
            subhead: 'Заполните все поля, чтобы сформировать отчёт в PDF',
            label_name: 'Ваше имя',
            label_smu: 'Какое ваше СМУ?',
            label_shift: 'Какая смена?',
            shift_1: 'Первая',
            shift_2: 'Вторая',
            shift_3: 'Третья',
            label_phone: 'Номер телефона',
            label_materials: 'Сколько было затрачено материала и какого?',
            label_tech_used: 'Использовалась ли техника?',
            radio_yes: 'Да',
            radio_no: 'Нет',
            label_tech_details: 'Если да, то какая техника использовалась?',
            btn_pdf: 'Скачать PDF',
            status: 'PDF успешно создан и скачан! Проверьте папку «Загрузки».',
            alert_fill: 'Пожалуйста, заполните все обязательные поля (имя, СМУ, телефон, материалы).',
            translating: 'Идёт перевод ответов на русский...',
            pdf_note: 'Примечание: PDF-отчёт сформирован на русском языке для единообразия.'
        },
        en: {
            h1: 'Survey',
            subhead: 'Fill in all fields to generate a PDF report',
            label_name: 'Your name',
            label_smu: 'What is your SMU?',
            label_shift: 'Which shift?',
            shift_1: 'First',
            shift_2: 'Second',
            shift_3: 'Third',
            label_phone: 'Phone number',
            label_materials: 'How much material was used and what kind?',
            label_tech_used: 'Was equipment used?',
            radio_yes: 'Yes',
            radio_no: 'No',
            label_tech_details: 'If yes, what equipment was used?',
            btn_pdf: 'Download PDF',
            status: 'PDF successfully created and downloaded! Check the "Downloads" folder.',
            alert_fill: 'Please fill in all required fields (name, SMU, phone, materials).',
            translating: 'Translating answers to Russian...',
            pdf_note: 'Note: The PDF report is generated in Russian for consistency, please do not worry.'
        },
        tt: {
            h1: 'Сораулар',
            subhead: 'PDF-отчёт төзер өчен барлык кырларны тутырыгыз',
            label_name: 'Исемегез',
            label_smu: 'СМУ ныгыз?',
            label_shift: 'Нинди смена?',
            shift_1: 'Беренче',
            shift_2: 'Икенче',
            shift_3: 'Өченче',
            label_phone: 'Телефон номеры',
            label_materials: 'Күпме материал кулланылды һәм нинди?',
            label_tech_used: 'Техника кулланылдымы?',
            radio_yes: 'Әйе',
            radio_no: 'Юк',
            label_tech_details: 'Әйе булса, нинди техника кулланылды?',
            btn_pdf: 'PDF йөкләү',
            status: 'PDF уңышлы төзелде һәм йөкләнде! "Йөкләүләр" папкасын тикшерегез.',
            alert_fill: 'Зинһар, барлык мәҗбүри кырларны тутырыгыз (исем, СМУ, телефон, материаллар).',
            translating: 'Җавапларны рус теленә тәрҗемә итү...',
            pdf_note: 'Искәрмә: PDF-отчёт рус телендә төзелде, борчылмагыз.'
        }
    };

    let currentLang = localStorage.getItem('lang') || 'ru';

    // ========== УСТАНОВКА ЯЗЫКА ==========
    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        localStorage.setItem('lang', lang);
        const t = translations[lang];

        document.getElementById('h1-text').textContent = t.h1;
        const subheadSpan = document.querySelector('#subhead-text span');
        if (subheadSpan) subheadSpan.textContent = t.subhead;

        document.getElementById('label-name').textContent = t.label_name;
        document.getElementById('label-smu').textContent = t.label_smu;
        document.getElementById('label-shift').textContent = t.label_shift;
        document.getElementById('shift-1').textContent = t.shift_1;
        document.getElementById('shift-2').textContent = t.shift_2;
        document.getElementById('shift-3').textContent = t.shift_3;
        document.getElementById('label-phone').textContent = t.label_phone;
        document.getElementById('label-materials').textContent = t.label_materials;
        document.getElementById('label-tech-used').textContent = t.label_tech_used;
        document.getElementById('radio-yes').textContent = t.radio_yes;
        document.getElementById('radio-no').textContent = t.radio_no;
        document.getElementById('label-tech-details').textContent = t.label_tech_details;
        document.getElementById('btn-pdf').textContent = t.btn_pdf;
        document.getElementById('status-text').textContent = t.status;

        const placeholders = {
            ru: { name: 'Иванов Иван', smu: 'Например: СМУ-7', phone: '+7 999 123-45-67', materials: 'Например: 5 кг цемента, 2 рулона обоев...', techDetails: 'Например: экскаватор, подъёмник...' },
            en: { name: 'Ivan Ivanov', smu: 'E.g.: SMU-7', phone: '+7 999 123-45-67', materials: 'E.g.: 5 kg of cement, 2 rolls of wallpaper...', techDetails: 'E.g.: excavator, lift...' },
            tt: { name: 'Иванов Иван', smu: 'Мәсәлән: СМУ-7', phone: '+7 999 123-45-67', materials: 'Мәсәлән: 5 кг цемент, 2 төп кәгазь...', techDetails: 'Мәсәлән: экскаватор, лифт...' }
        };
        const p = placeholders[lang] || placeholders.ru;
        document.getElementById('name').placeholder = p.name;
        document.getElementById('smu').placeholder = p.smu;
        document.getElementById('phone').placeholder = p.phone;
        document.getElementById('materials').placeholder = p.materials;
        document.getElementById('techDetails').placeholder = p.techDetails;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
    }

    // ========== ПОКАЗАТЬ/СКРЫТЬ ТЕХНИКУ ==========
    function toggleTech(show) {
        const group = document.getElementById('techDetailsGroup');
        if (show) {
            group.style.display = 'block';
            setTimeout(() => { group.style.opacity = '1'; }, 10);
        } else {
            group.style.opacity = '0';
            setTimeout(() => { group.style.display = 'none'; }, 300);
        }
    }

    // ========== ПЕРЕВОД ТЕКСТА (API) ==========
    async function translateText(text, targetLang = 'ru') {
        if (!text || text.trim() === '') return text;
        if (/[\u0400-\u04FF]/.test(text)) return text;
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
            return text;
        } catch (e) {
            console.warn('Ошибка перевода:', e);
            return text;
        }
    }

    // ========== ГЕНЕРАЦИЯ PDF ==========
    async function generatePDFWithTranslation() {
        const name = document.getElementById('name').value.trim();
        const smu = document.getElementById('smu').value.trim();
        const shift = document.getElementById('shift').value;
        const phone = document.getElementById('phone').value.trim();
        const materials = document.getElementById('materials').value.trim();
        const tech = document.querySelector('input[name="tech"]:checked').value;
        let techDetails = document.getElementById('techDetails').value.trim();

        if (!name || !smu || !phone || !materials) {
            alert(translations[currentLang].alert_fill);
            return;
        }

        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'flex';
        document.getElementById('status-text').textContent = translations[currentLang].translating;
        statusDiv.style.background = 'rgba(251, 191, 36, 0.08)';
        statusDiv.style.borderColor = 'rgba(251, 191, 36, 0.25)';
        statusDiv.style.color = '#fbbf24';

        try {
            const [transName, transSmu, transMaterials, transTechDetails] = await Promise.all([
                translateText(name),
                translateText(smu),
                translateText(materials),
                translateText(techDetails)
            ]);

            const finalName = transName || name;
            const finalSmu = transSmu || smu;
            const finalMaterials = transMaterials || materials;
            const finalTechDetails = (tech === 'Да') ? (transTechDetails || techDetails || 'Не указано') : 'Нет';

            const now = new Date();
            const dateStr = now.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            const fileName = `отчёт_${now.toISOString().slice(0, 19).replace(/[:-]/g, '')}.pdf`;

            const ru = translations.ru;
            if (!ru.pdf_header) {
                Object.assign(ru, {
                    pdf_header: 'ОТЧЁТ ПО ОПРОСУ',
                    pdf_label_name: 'Имя',
                    pdf_label_smu: 'СМУ',
                    pdf_label_shift: 'Смена',
                    pdf_label_phone: 'Телефон',
                    pdf_label_materials: 'Затраченные материалы',
                    pdf_label_tech_used: 'Техника использовалась',
                    pdf_label_tech_details: 'Какая техника',
                    pdf_footer: 'Создано автоматически'
                });
            }

            const fields = [
                { label: ru.pdf_label_name, value: finalName },
                { label: ru.pdf_label_smu, value: finalSmu },
                { label: ru.pdf_label_shift, value: shift },
                { label: ru.pdf_label_phone, value: phone },
                { label: ru.pdf_label_materials, value: finalMaterials },
                { label: ru.pdf_label_tech_used, value: tech },
                { label: ru.pdf_label_tech_details, value: finalTechDetails }
            ];

            let content = [
                { text: ru.pdf_header, style: 'header', alignment: 'center', margin: [0, 0, 0, 5] },
                { text: dateStr, style: 'date', alignment: 'center', margin: [0, 0, 0, 20] }
            ];

            fields.forEach((item, index) => {
                if (index > 0) {
                    content.push({
                        canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, color: '#d1d9e6' }],
                        margin: [0, 10, 0, 10]
                    });
                }
                content.push({
                    stack: [
                        { text: item.label, style: 'label' },
                        { text: item.value || '—', style: 'value' }
                    ],
                    margin: [0, 2, 0, 2]
                });
            });

            const noteText = translations[currentLang].pdf_note || '';
            if (noteText) {
                content.push({
                    text: noteText,
                    style: 'note',
                    alignment: 'center',
                    margin: [0, 20, 0, 10]
                });
            }

            content.push({
                text: ru.pdf_footer + ' • ' + new Date().toLocaleDateString('ru-RU'),
                style: 'footer',
                alignment: 'center',
                margin: [0, 10, 0, 0]
            });

            const docDefinition = {
                content: content,
                styles: {
                    header: { fontSize: 22, bold: true, color: '#1e293b' },
                    date: { fontSize: 13, color: '#64748b' },
                    label: { fontSize: 13, bold: true, color: '#3b82f6', margin: [0, 2, 0, 2] },
                    value: { fontSize: 15, color: '#0f172a', margin: [0, 0, 0, 4] },
                    note: { fontSize: 11, color: '#64748b', italics: true, alignment: 'center' },
                    footer: { fontSize: 10, color: '#94a3b8', italics: true, alignment: 'center' }
                },
                defaultStyle: { font: 'Roboto' },
                pageMargins: [40, 60, 40, 60]
            };

            pdfMake.createPdf(docDefinition).download(fileName);

            statusDiv.style.background = 'rgba(251, 191, 36, 0.1)';
            statusDiv.style.borderColor = 'rgba(251, 191, 36, 0.3)';
            statusDiv.style.color = '#fbbf24';
            document.getElementById('status-text').textContent = translations.ru.status;
            setTimeout(() => { statusDiv.style.display = 'none'; }, 6000);

        } catch (error) {
            console.error('Ошибка:', error);
            alert('Произошла ошибка при создании PDF. Пожалуйста, проверьте консоль.');
            statusDiv.style.display = 'none';
        }
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    document.addEventListener('DOMContentLoaded', function() {
        setLanguage(currentLang);
        const noRadio = document.querySelector('input[name="tech"][value="Нет"]');
        if (noRadio && noRadio.checked) {
            const group = document.getElementById('techDetailsGroup');
            group.style.display = 'none';
            group.style.opacity = '0';
        }
    });
</script>
