<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опросник</title>
    <!-- Подключаем pdfmake для генерации PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.9/vfs_fonts.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="tel"],
        textarea,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        .inline-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .inline-group label {
            font-weight: normal;
            display: inline;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📋 Опросник</h1>
    <form id="surveyForm">
        <!-- Имя -->
        <div class="form-group">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" required>
        </div>

        <!-- Смена -->
        <div class="form-group">
            <label for="shift">Какая смена?</label>
            <select id="shift">
                <option value="Первая">Первая</option>
                <option value="Вторая">Вторая</option>
                <option value="Третья">Третья</option>
            </select>
        </div>

        <!-- Номер телефона -->
        <div class="form-group">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="+7 999 123-45-67" required>
        </div>

        <!-- Материалы -->
        <div class="form-group">
            <label for="materials">Сколько было затрачено материала и какого?</label>
            <textarea id="materials" rows="3" placeholder="Например: 5 кг цемента, 2 рулона обоев..." required></textarea>
        </div>

        <!-- Техника -->
        <div class="form-group">
            <label>Использовалась ли техника?</label>
            <div class="inline-group">
                <label><input type="radio" name="tech" value="Да" onclick="toggleTech(true)"> Да</label>
                <label><input type="radio" name="tech" value="Нет" onclick="toggleTech(false)" checked> Нет</label>
            </div>
        </div>

        <!-- Какая техника (показывается только если выбрано "Да") -->
        <div class="form-group" id="techDetailsGroup" style="display: none;">
            <label for="techDetails">Если да, то какая техника использовалась?</label>
            <textarea id="techDetails" rows="2" placeholder="Например: экскаватор, подъёмник..."></textarea>
        </div>

        <button type="button" onclick="generatePDF()">Скачать PDF</button>
    </form>

    <div id="status">✅ PDF успешно создан и скачан! Проверьте папку «Загрузки».</div>

    <script>
        // Показывать/скрывать поле "какая техника" в зависимости от выбора
        function toggleTech(show) {
            document.getElementById('techDetailsGroup').style.display = show ? 'block' : 'none';
        }

        function generatePDF() {
            // 1. Считываем данные из формы
            const name = document.getElementById('name').value.trim();
            const shift = document.getElementById('shift').value;
            const phone = document.getElementById('phone').value.trim();
            const materials = document.getElementById('materials').value.trim();
            const tech = document.querySelector('input[name="tech"]:checked').value;
            let techDetails = '';
            if (tech === 'Да') {
                techDetails = document.getElementById('techDetails').value.trim() || 'Не указано';
            } else {
                techDetails = 'Нет';
            }

            // Проверка обязательных полей
            if (!name || !phone || !materials) {
                alert('Пожалуйста, заполните все обязательные поля (имя, телефон, материалы).');
                return;
            }

            // 2. Формируем структуру документа для pdfmake
            const now = new Date();
            const dateStr = now.toLocaleString('ru-RU');
            const fileName = `отчёт_${now.toISOString().slice(0, 19).replace(/[:-]/g, '')}.pdf`;

            const docDefinition = {
                content: [
                    { text: '📄 Отчёт по опросу', style: 'header' },
                    { text: `Дата: ${dateStr}`, style: 'subheader' },
                    { text: `Имя: ${name}`, style: 'text' },
                    { text: `Смена: ${shift}`, style: 'text' },
                    { text: `Телефон: ${phone}`, style: 'text' },
                    { text: `Затраченные материалы: ${materials}`, style: 'text' },
                    { text: `Техника использовалась: ${tech}`, style: 'text' },
                    { text: `Какая техника: ${techDetails}`, style: 'text' },
                    { text: 'Создано автоматически', style: 'footer' }
                ],
                styles: {
                    header: { fontSize: 18, bold: true, margin: [0, 0, 0, 15] },
                    subheader: { fontSize: 14, bold: true, margin: [0, 10, 0, 5] },
                    text: { fontSize: 12, margin: [0, 5, 0, 5] },
                    footer: { fontSize: 10, color: '#888', margin: [0, 30, 0, 0] }
                },
                defaultStyle: {
                    font: 'Roboto'  // поддержка кириллицы
                }
            };

            // 3. Генерируем и скачиваем PDF
            pdfMake.createPdf(docDefinition).download(fileName);

            // 4. Показываем сообщение об успехе
            document.getElementById('status').style.display = 'block';

            // (опционально) очистка формы или другие действия
        }
    </script>

</body>
</html>
